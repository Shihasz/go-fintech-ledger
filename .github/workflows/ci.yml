name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Go Quality Check
  go-quality:
    name: Lint & Test (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Install Dependencies
        run: go mod download

      - name: Run Vet (Static Analysis)
        run: go vet ./...

      - name: Run Tests
        # Running all tests in the project
        run: go test -v ./...

  # Job 2: Docker Build Check
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: go-quality # Only run if quality checks pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service
        run: docker build -f cmd/auth-service/Dockerfile -t auth-service:ci .
