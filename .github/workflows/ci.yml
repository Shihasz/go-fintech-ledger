name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Go Quality Check
  go-quality:
    name: Lint & Test (Go)
    runs-on: ubuntu-latest
    
    # 1. Spin up a temporary PostgreSQL database for this job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fintech_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Dependencies
        run: go mod download

      # 2. Download golang-migrate so we can build the tables
      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      # 3. Apply the database schema
      - name: Run Database Migrations
        run: migrate -path infra/db/migration -database "postgresql://root:secret@127.0.0.1:5432/fintech_ledger?sslmode=disable" -verbose up

      - name: Run Vet (Static Analysis)
        run: go vet ./...

      # 4. Run tests
      - name: Run Tests
        run: go test -v ./...

  # Job 2: Docker Build Check
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: go-quality # Only run if quality checks pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service
        run: docker build -f cmd/auth-service/Dockerfile -t auth-service:ci .