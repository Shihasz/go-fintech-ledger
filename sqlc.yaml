version: "2"
sql:
  - engine: "postgresql"
    queries: "infra/db/query"
    schema: "infra/db/migration"
    gen:
      go:
        package: "db"
        out: "internal/ledger/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false